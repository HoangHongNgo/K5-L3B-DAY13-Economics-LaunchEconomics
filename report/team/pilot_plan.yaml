# Lab 13 · Nhiệm vụ D · Kế hoạch pilot trợ lý hoàn phí LogiX-VN (Gate 2a)
# Số tính bằng src/lab13.py (mục D1). Dữ liệu đầu vào là giả lập (simulated) khi ghi rõ.
#
# D1 · Cỡ mẫu (baseline 0,70; mục tiêu +5 điểm; alpha 0,05; power 0,8; ICC 0,02)
#   a) Chia theo yêu cầu: 1.251 yêu cầu mỗi nhóm (đủ mẫu, nhưng tách tác động kém)
#   b) Theo nhân viên, m = 75: DE = 1 + 74 x 0,02 = 2,48; n = 3.103 mỗi nhóm = 42 người mỗi nhóm; tổng 84 > 40 nhân viên, không đủ người
#   c) 20 nhân viên mỗi nhóm: cỡ mẫu hiệu dụng tối đa 20 / 0,02 = 1.000 < 1.251, không đạt mức chênh 5 điểm
#   d) 6 depot mỗi nhóm: tối đa 6 / 0,02 = 300 yêu cầu hiệu dụng, và chỉ 6 cụm
#   e) Mức chênh 6 điểm (859 mỗi nhóm), 20 nhân viên mỗi nhóm: cần m >= 299 yêu cầu mỗi nhân viên (DE 6,96)
#
# D2 · Năm câu kiểm tra "tách được tác động" (chia theo nhân viên, 20 + 20):
#   1. Đối chứng chạy cùng thời gian: có, 20 nhân viên đối chứng làm cùng tuần, cùng depot
#   2. Chia ngẫu nhiên hay do người chọn: bốc thăm bằng code với seed ghi trước, phân tầng theo depot
#   3. Ảnh hưởng gián tiếp: có nguy cơ chia sẻ câu trả lời trong depot; giảm bằng quyền truy cập theo tài khoản và log lượt mở trợ lý theo staff_id
#   4. Chỉ số chính, ngưỡng, ngày quyết định đã viết trước: có, chốt trước ngày bắt đầu (file này)
#   5. Ít nhất 20 cụm mỗi nhóm: có, đúng 20 nhân viên mỗi nhóm
#
# Đánh đổi đã chấp nhận: với 40 nhân viên không cách chia theo cụm nào đủ mẫu cho 5 điểm.
#   Nhóm chọn mức chênh phát hiện được 6 điểm (n = 859 mỗi nhóm, m >= 299 yêu cầu mỗi nhân viên).
#   Nếu tác động thật chỉ 5 điểm thì power còn khoảng 0,64. Giám đốc vận hành phải ký chấp nhận trước khi bắt đầu.
#
# Tỉ lệ mo_lai_trong_7_ngay hiện tại: 4,25% (51/1.200); trong phạm vi noi_dia + hang_nang là 3,97%.
#   Ngưỡng tuyệt đối 3% sẽ dừng pilot ngay tuần đầu, nên dùng so với đối chứng (chênh +2 điểm) kèm trần tuyệt đối 6%.

pilot:
  owner: "Giám đốc vận hành LogiX-VN"
  scope: "Chỉ noi_dia và hang_nang (0,22x và 0,69x so với 12.000 đ, simulated), 12 depot; loại quoc_te (1,88x, thành công 27,3%) và doi_tac (0,85x) ngoài phạm vi"
  assignment:
    unit: "staff"
    control_share: 0.5
    randomized: true
  rollout: [0.10, 0.25, 0.50]     # mỗi bước một tuần: 4 -> 10 -> 20 nhân viên; chỉ đo chỉ số chính từ bước 0.50
  primary_metric:
    name: dong_trong_24h_khong_mo_lai_7_ngay
    baseline: 0.70
    mde: 0.06                     # đánh đổi đã chấp nhận (mục tiêu gốc 0.05 không đủ mẫu)
    alpha: 0.05
    power: 0.80
    n_per_arm: 859
    design_effect: 6.96
    clusters_per_arm: 20
  identifiability:
    concurrent_control: "Có: 20 nhân viên đối chứng làm cùng tuần, cùng depot, phân tầng theo depot"
    spillover_risk: "Có nguy cơ chia sẻ câu trả lời trong depot; giảm bằng quyền truy cập theo tài khoản và log lượt mở trợ lý theo staff_id"
    predeclared: "Chỉ số chính, ngưỡng, luật dừng, seed bốc thăm và ngày quyết định chốt bằng file này trước ngày bắt đầu"
  stop_rules:
    - "NẾU mở lại 7 ngày của nhóm trợ lý cao hơn đối chứng từ 2 điểm hoặc vượt 6% tuyệt đối, hoặc có từ 1 ca hoàn trùng TRONG 3 ngày liên tiếp THÌ Giám đốc vận hành tắt trợ lý trong 30 phút KHÔNG THÌ không được sang bước rollout tiếp"
    - "NẾU chi phí mỗi việc thành công vượt 8.000 đ (simulated) TRONG 2 tuần liên tiếp THÌ PM trợ lý hoàn phí thu hẹp về noi_dia và giới hạn 2 lần chạy KHÔNG THÌ không được mở hang_nang"
    - "NẾU tỉ lệ bỏ qua gợi ý (sua + bo) vượt 40% TRONG 1 tuần THÌ Trưởng nhóm CSKH phỏng vấn 5 nhân viên trong 3 ngày KHÔNG THÌ không được chuyển bước rollout"
  interim_looks: "chỉ kiểm tra chỉ số an toàn"
  rollback: "Giám đốc vận hành bấm cờ tắt, hiệu lực trong 30 phút; khách được phục vụ bằng luồng nhân viên tự làm"
  decision_date: "2027-01-05"
  simulated_inputs:
    - "phut_xem_lai_simulated (890 phút trong mẫu) và phut_lam_lai_simulated (1.132 phút)"
    - "Mọi chi phí mỗi việc thành công (4.472 đ; 3.414 đ trong phạm vi; ngưỡng 8.000 đ) tính từ hai cột trên"
    - "Chi phí cố định 40 triệu đ/tháng và giá token, tool, lương 2.000 đ/phút là giả định của lab"
